<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beans' Casino Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Custom scrollbar for the chat */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1f2937; 
        }
        ::-webkit-scrollbar-thumb {
            background: #4b5563; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6b7280; 
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.4s ease-out forwards;
        }
        .casino-glow {
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex overflow-hidden font-sans">

    <!-- Sidebar -->
    <div class="w-64 bg-gray-900 border-r border-gray-700 flex flex-col shadow-xl z-10 hidden md:flex">
        <div class="p-4 border-b border-gray-700 flex items-center space-x-3">
            <div class="w-10 h-10 bg-indigo-500 rounded-full flex items-center justify-center text-white font-bold text-xl casino-glow">
                <i class="fas fa-dice"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg text-white">Casino Bot</h1>
                <span class="text-xs text-green-400 flex items-center">
                    <span class="w-2 h-2 bg-green-500 rounded-full mr-2 animate-pulse"></span>
                    Online
                </span>
            </div>
        </div>
        
        <div class="p-6 flex-1 flex flex-col items-center justify-start space-y-4">
            <div class="w-24 h-24 bg-blue-600 rounded-full flex items-center justify-center text-4xl shadow-lg border-4 border-gray-800 relative overflow-hidden group cursor-pointer" id="pfp-container" title="Click to change PFP">
                <img id="user-pfp" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23fff'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>" class="w-full h-full object-cover">
                <div class="absolute inset-0 bg-black bg-opacity-50 flex flex-col items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                    <i class="fas fa-camera text-white mb-1"></i>
                    <span class="text-[10px] text-white">Upload</span>
                </div>
                <div class="absolute bottom-1 right-1 w-5 h-5 bg-green-500 border-2 border-gray-800 rounded-full z-10"></div>
                <input type="file" id="pfp-upload" class="hidden" accept="image/*">
            </div>
            <div class="text-center">
                <h2 class="text-2xl font-bold text-white">Beans</h2>
                <p class="text-gray-400 text-sm italic">VIP Gambler</p>
            </div>
            
            <div class="w-full bg-gray-800 rounded-xl p-4 mt-4 border border-gray-700 shadow-inner text-center">
                <p class="text-gray-400 text-xs uppercase tracking-wider mb-1">Current Balance</p>
                <p class="text-3xl font-bold text-yellow-400 flex items-center justify-center">
                    <i class="fas fa-coins text-yellow-500 mr-2 text-xl"></i>
                    <span id="balance-display">0</span>
                </p>
            </div>

            <!-- Stats Mini-Panel -->
            <div class="w-full grid grid-cols-2 gap-2 mt-4 text-xs">
                <div class="bg-gray-800 p-2 rounded-lg border border-gray-700 text-center">
                    <span class="text-gray-500 block">Status</span>
                    <span class="text-indigo-400 font-bold uppercase">Pro</span>
                </div>
                <div class="bg-gray-800 p-2 rounded-lg border border-gray-700 text-center">
                    <span class="text-gray-500 block">Server</span>
                    <span class="text-green-400 font-bold uppercase">Live</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Chat Area -->
    <div class="flex-1 flex flex-col bg-gray-800 relative">
        
        <!-- Mobile Header -->
        <div class="md:hidden p-3 bg-gray-900 border-b border-gray-700 flex items-center justify-between shadow-md">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 bg-indigo-500 rounded-full flex items-center justify-center"><i class="fas fa-dice text-sm"></i></div>
                <span class="font-bold">Casino Bot</span>
            </div>
            <div class="flex items-center space-x-2 text-yellow-400 font-bold bg-gray-800 px-3 py-1 rounded-full border border-gray-700">
                <i class="fas fa-coins text-xs"></i>
                <span id="mobile-balance-display">0</span>
            </div>
        </div>

        <!-- Chat History -->
        <div id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4">
            <div class="flex justify-center my-4">
                <span class="text-xs text-gray-500 bg-gray-900 px-3 py-1 rounded-full border border-gray-700">Connected to Lobby #001</span>
            </div>
        </div>

        <!-- Chat Input Form -->
        <div class="p-4 bg-gray-900 border-t border-gray-700">
            <form id="chat-form" class="flex items-center relative max-w-4xl mx-auto">
                <input 
                    type="text" 
                    id="chat-input" 
                    autocomplete="off"
                    placeholder="Type /help for commands..." 
                    class="flex-1 bg-gray-800 text-gray-100 placeholder-gray-500 rounded-xl py-3 pl-4 pr-12 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all border border-gray-700"
                >
                <button type="submit" class="absolute right-2 top-1/2 transform -translate-y-1/2 w-10 h-10 bg-indigo-600 hover:bg-indigo-500 rounded-lg flex items-center justify-center transition-colors text-white shadow-lg">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- CONFIG & INIT ---
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "", authDomain: "", projectId: "", storageBucket: "", messagingSenderId: "", appId: ""
        };
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'casino-default';
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- STATE ---
        let currentUser = null;
        let balance = 1000;
        let userPfp = "";
        let customBots = [];
        const USERNAME = "Beans";
        const DEFAULT_PFP = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23fff'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>";

        // --- UI ELEMENTS ---
        const chatBox = document.getElementById('chat-box');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');
        const balanceDisplay = document.getElementById('balance-display');
        const mobileBalanceDisplay = document.getElementById('mobile-balance-display');
        const pfpContainer = document.getElementById('pfp-container');
        const pfpUpload = document.getElementById('pfp-upload');
        const userPfpImg = document.getElementById('user-pfp');

        // --- FIREBASE LOGIC ---
        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.error("Auth Fail:", err);
                appendMessage('System', 'Server error. Retrying...', 'error');
                // Simple exponential backoff retry logic
                setTimeout(initAuth, 2000);
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                setupDataListener(user.uid);
            }
        });

        initAuth();

        function setupDataListener(uid) {
            // STRICT PATH RULE: /artifacts/{appId}/users/{userId}/{collectionName}
            const docRef = doc(db, 'artifacts', appId, 'users', uid, 'profile', 'data');
            
            onSnapshot(docRef, (snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.data();
                    balance = data.balance ?? 1000;
                    userPfp = data.pfp || "";
                    if(userPfp) userPfpImg.src = userPfp;
                    customBots = data.bots || [];
                    updateBalanceUI();
                } else {
                    saveData(1000, "", []);
                    appendMessage('Casino Bot', `Welcome ${USERNAME}! I've given you $1,000 to start. Type /help.`, 'bot');
                }
            }, (err) => {
                console.error("Firestore error:", err);
            });
        }

        async function saveData(newBalance = balance, newPfp = userPfp, newBots = customBots) {
            if (!currentUser) return;
            const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'profile', 'data');
            try {
                await setDoc(docRef, { 
                    balance: newBalance,
                    username: USERNAME,
                    pfp: newPfp,
                    bots: newBots,
                    lastUpdated: Date.now()
                }, { merge: true });
            } catch (err) {
                console.error("Save error:", err);
            }
        }

        // --- UI UPDATES ---
        function updateBalanceUI() {
            const formatted = balance.toLocaleString();
            balanceDisplay.innerText = formatted;
            mobileBalanceDisplay.innerText = formatted;
        }

        function appendMessage(sender, text, type = 'user', pfpOverride = null, isRawHtml = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex w-full mt-2 space-x-3 max-w-2xl ${type === 'user' ? "ml-auto justify-end" : ""} animate-fade-in-up`;
            
            let bubbleColor = "bg-gray-700 text-white";
            let avatarHtml = `<div class="w-8 h-8 rounded-full bg-blue-600 flex-shrink-0 flex items-center justify-center text-white"><i class="fas fa-user"></i></div>`;
            
            if (pfpOverride) {
                avatarHtml = `<div class="w-8 h-8 rounded-full flex-shrink-0 border border-gray-600 overflow-hidden bg-gray-800"><img src="${pfpOverride}" class="w-full h-full object-cover"></div>`;
            } else if (type === 'user') {
                const src = userPfp || DEFAULT_PFP;
                avatarHtml = `<div class="w-8 h-8 rounded-full flex-shrink-0 border border-gray-600 overflow-hidden bg-gray-800"><img src="${src}" class="w-full h-full object-cover"></div>`;
            } else if (type === 'bot') {
                bubbleColor = "bg-indigo-600 text-white";
                avatarHtml = `<div class="w-8 h-8 rounded-full bg-indigo-500 flex-shrink-0 flex items-center justify-center text-white"><i class="fas fa-dice"></i></div>`;
            } else if (type === 'error') {
                bubbleColor = "bg-red-900 border border-red-500 text-white";
                avatarHtml = `<div class="w-8 h-8 rounded-full bg-red-600 flex-shrink-0 flex items-center justify-center text-white"><i class="fas fa-bug"></i></div>`;
            }

            const content = isRawHtml ? text : `<div class="${bubbleColor} rounded-2xl ${type === 'user' ? 'rounded-tr-sm' : 'rounded-tl-sm'} px-4 py-2 shadow-md">${text}</div>`;

            if (type === 'user') {
                msgDiv.innerHTML = `<div class="flex flex-col items-end"><span class="text-[10px] text-gray-500 mb-1 uppercase tracking-tighter">${sender}</span>${content}</div>${avatarHtml}`;
            } else {
                msgDiv.innerHTML = `${avatarHtml}<div class="flex flex-col items-start"><span class="text-[10px] text-gray-500 mb-1 uppercase tracking-tighter">${sender}</span>${content}</div>`;
            }

            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendGambleResult(pfp, username, cmdName, resultType, amount) {
            const isWin = resultType === 'WON';
            const color = isWin ? 'green' : 'red';
            const sign = isWin ? '+' : '-';
            
            const msgDiv = document.createElement('div');
            msgDiv.className = "flex w-full mt-4 mb-4 justify-center animate-fade-in-up";
            msgDiv.innerHTML = `
                <div class="flex flex-col items-center bg-gray-800 border-2 border-${color}-500 rounded-2xl p-5 w-64 transform transition-all hover:scale-105 relative overflow-hidden shadow-2xl">
                    <div class="absolute inset-0 opacity-10 bg-${color}-500 pointer-events-none"></div>
                    <div class="relative w-16 h-16 mb-2 rounded-full border-4 border-${color}-600 shadow-lg overflow-hidden bg-gray-900 z-10">
                        <img src="${pfp}" class="w-full h-full object-cover">
                    </div>
                    <span class="font-black text-white text-lg tracking-wide uppercase z-10">${username}</span>
                    <span class="text-[10px] text-gray-400 font-medium mb-3 bg-gray-900 px-3 py-1 rounded-full mt-1 border border-gray-700 z-10">PLAYED ${cmdName}</span>
                    <div class="text-4xl font-black text-${color}-500 mb-1 tracking-wider z-10" style="text-shadow: 0 0 10px rgba(0,0,0,0.5);">
                        ${resultType}
                    </div>
                    <div class="text-2xl font-bold ${isWin ? 'text-yellow-400' : 'text-gray-400'} flex items-center z-10">
                        ${sign}$${amount.toLocaleString()}
                    </div>
                </div>
            `;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // --- GAME ENGINE ---
        const items = ["dog","cat","dragon","unicorn","fish","shark","eagle","lion","tiger","wolf","diamond","ruby","gold","silver","iron","apple","banana","grape","ufo","mech","fire","water","lightning","magic"];
        const actions = ["bet", "hunt", "mine", "explore", "summon"];
        const dynamicCommands = {};

        actions.forEach(action => {
            items.forEach(item => {
                dynamicCommands[`/${action}${item}`] = async (args) => {
                    if(!args[0]) return appendMessage('Casino Bot', `Usage: /${action}${item} <amount>`, 'error');
                    const amt = parseInt(args[0]);
                    if(isNaN(amt) || amt <= 0 || amt > balance) return appendMessage('Casino Bot', 'Invalid amount.', 'error');

                    const win = Math.random() < 0.45;
                    const mult = (Math.random() * 2 + 0.5).toFixed(1);
                    const winAmt = Math.floor(amt * mult);

                    if(win) {
                        balance += winAmt;
                        appendGambleResult(userPfp || DEFAULT_PFP, USERNAME, `/${action}${item}`, 'WON', winAmt);
                    } else {
                        balance -= amt;
                        appendGambleResult(userPfp || DEFAULT_PFP, USERNAME, `/${action}${item}`, 'LOST', amt);
                    }
                    saveData();
                };
            });
        });

        const handleCommand = async (input) => {
            const parts = input.trim().split(/\s+/);
            const cmd = parts[0].toLowerCase();
            const args = parts.slice(1);

            if (cmd === '/help') {
                appendMessage('Casino Bot', `
                    <div class="space-y-3 bg-gray-900 p-4 rounded-xl border border-indigo-500">
                        <div class="font-bold text-indigo-400 border-b border-gray-700 pb-2">COMMAND LIST</div>
                        <div class="grid grid-cols-2 gap-2 text-[10px]">
                            <div class="bg-gray-800 p-2 rounded"><b>/bal</b> - Check coins</div>
                            <div class="bg-gray-800 p-2 rounded"><b>/dice &lt;amt&gt;</b> - Gamble</div>
                            <div class="bg-gray-800 p-2 rounded"><b>/allin</b> - High risk</div>
                            <div class="bg-gray-800 p-2 rounded"><b>/beg</b> - Get coins</div>
                            <div class="bg-gray-800 p-2 rounded"><b>/createbot &lt;n&gt;</b> - Add AI</div>
                            <div class="bg-gray-800 p-2 rounded"><b>/deletebot &lt;n&gt;</b> - Remove AI</div>
                        </div>
                        <div class="text-[10px] text-gray-400">Try dynamic games: /betdragon, /huntwolf, /minegold... (300+ total)</div>
                    </div>
                `, 'bot', null, true);
                return;
            }

            switch(cmd) {
                case '/bal':
                case '/balance':
                    appendMessage('Casino Bot', `Balance: <b>$${balance.toLocaleString()}</b>`, 'bot', null, true);
                    break;
                case '/beg':
                    if(balance > 100) return appendMessage('Casino Bot', 'You have enough coins!', 'error');
                    const gift = Math.floor(Math.random() * 150) + 50;
                    balance += gift;
                    appendMessage('Casino Bot', `Someone dropped <b>$${gift}</b> for you!`, 'bot', null, true);
                    saveData();
                    break;
                case '/dice':
                    const dAmt = parseInt(args[0]);
                    if(isNaN(dAmt) || dAmt <= 0 || dAmt > balance) return appendMessage('Casino Bot', 'Check your amount.', 'error');
                    const roll = Math.floor(Math.random() * 6) + 1;
                    if(roll >= 4) {
                        balance += dAmt;
                        appendGambleResult(userPfp || DEFAULT_PFP, USERNAME, '/dice', 'WON', dAmt);
                    } else {
                        balance -= dAmt;
                        appendGambleResult(userPfp || DEFAULT_PFP, USERNAME, '/dice', 'LOST', dAmt);
                    }
                    saveData();
                    break;
                case '/allin':
                    if(balance <= 0) return appendMessage('Casino Bot', 'No coins.', 'error');
                    const current = balance;
                    if(Math.random() < 0.48) {
                        balance *= 2;
                        appendGambleResult(userPfp || DEFAULT_PFP, USERNAME, '/allin', 'WON', current);
                    } else {
                        balance = 0;
                        appendGambleResult(userPfp || DEFAULT_PFP, USERNAME, '/allin', 'LOST', current);
                    }
                    saveData();
                    break;
                case '/createbot':
                    const bName = args.join(' ');
                    if(!bName) return appendMessage('Casino Bot', 'Name needed.', 'error');
                    customBots.push(bName);
                    saveData();
                    appendMessage('Casino Bot', `Bot <b>${bName}</b> added.`, 'bot', null, true);
                    break;
                case '/deletebot':
                    const delName = args.join(' ');
                    const idx = customBots.indexOf(delName);
                    if(idx > -1) {
                        customBots.splice(idx, 1);
                        saveData();
                        appendMessage('Casino Bot', `Bot <b>${delName}</b> removed.`, 'bot', null, true);
                    }
                    break;
                default:
                    if(dynamicCommands[cmd]) {
                        await dynamicCommands[cmd](args);
                    } else {
                        appendMessage('Casino Bot', "Unknown command. Try /help.", 'error');
                    }
            }
        };

        // --- BOT ACTIVITY ---
        setInterval(() => {
            if(customBots.length === 0 || Math.random() > 0.4) return;
            const bot = customBots[Math.floor(Math.random() * customBots.length)];
            const botPfp = `https://api.dicebear.com/7.x/bottts/svg?seed=${bot}`;
            
            if(Math.random() < 0.3) {
                const phrases = ["Let's gooo!", "I'm rich!", "Rigged!", "Who's betting?", "All in?"];
                appendMessage(bot, phrases[Math.floor(Math.random() * phrases.length)], 'user', botPfp);
            } else {
                const win = Math.random() < 0.45;
                const amt = Math.floor(Math.random() * 500) + 10;
                appendGambleResult(botPfp, bot, '/dice', win ? 'WON' : 'LOST', amt);
            }
        }, 10000);

        // --- PFP UPLOAD ---
        pfpContainer.onclick = () => pfpUpload.click();
        pfpUpload.onchange = (e) => {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 100; canvas.height = 100;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, 100, 100);
                    userPfp = canvas.toDataURL('image/jpeg', 0.7);
                    userPfpImg.src = userPfp;
                    saveData();
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        };

        // --- INPUT HANDLING ---
        chatForm.onsubmit = (e) => {
            e.preventDefault();
            const val = chatInput.value.trim();
            if(!val) return;
            appendMessage(USERNAME, val, 'user');
            chatInput.value = '';
            if(val.startsWith('/')) {
                setTimeout(() => handleCommand(val), 500);
            }
        };

        updateBalanceUI();
    </script>
</body>
</html>
